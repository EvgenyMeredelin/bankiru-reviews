# ── Nginx virtual host for bankiru-reviews ──────────────────────────────────
# This file is installed on the HOST machine (not inside Docker). It runs
# on the same server as the Docker Compose stack and acts as the TLS
# termination point and reverse proxy for the bankiru-ui container.
#
# Traffic flow:
#   Browser → Nginx (port 443, TLS) → bankiru-ui (127.0.0.1:17060)
#
# Public URL: https://bankiru.uva-advanced.ru
# Upstream:   127.0.0.1:17060 (the bankiru-ui container)
#
# One-time setup (per host):
#   sudo cp config/bankiru-reviews.conf /etc/nginx/conf.d/bankiru-reviews.conf
#   sudo certbot certonly --webroot -w /var/www/html \
#        -d bankiru.uva-advanced.ru -d www.bankiru.uva-advanced.ru
#   sudo nginx -t && sudo systemctl reload nginx

# ── Server block 1: HTTP → HTTPS redirect ──────────────────────────────────
# All plain HTTP traffic is redirected to HTTPS, except for ACME challenges
# which must stay on HTTP for Let's Encrypt certificate renewals.
server {
    listen 80;
    server_name bankiru.uva-advanced.ru www.bankiru.uva-advanced.ru;

    # ACME-challenge location stays on HTTP for cert renewals.
    # Certbot places challenge files in /var/www/html/.well-known/acme-challenge/
    root /var/www/html;
    location /.well-known/acme-challenge/ {
        allow all;
        try_files $uri =404;
    }

    # Everything else gets a permanent redirect to HTTPS (canonical domain).
    location / {
        return 301 https://bankiru.uva-advanced.ru$request_uri;
    }
}

# ── Server block 2: www → non-www redirect (HTTPS) ─────────────────────────
# Canonical URL normalization: redirect www.bankiru.uva-advanced.ru to
# bankiru.uva-advanced.ru so there's a single canonical origin for cookies,
# OIDC redirect URIs, and HSTS.
server {
    listen 443 ssl;
    http2 on;
    server_name www.bankiru.uva-advanced.ru;

    # TLS certificates managed by Let's Encrypt / certbot.
    ssl_certificate     /etc/letsencrypt/live/bankiru.uva-advanced.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bankiru.uva-advanced.ru/privkey.pem;
    # Certbot-managed TLS settings (ciphers, protocols, session tickets).
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    # Diffie-Hellman parameters for forward secrecy.
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Permanent redirect to the canonical non-www domain.
    return 301 https://bankiru.uva-advanced.ru$request_uri;
}

# ── Server block 3: main application (HTTPS) ───────────────────────────────
# This is the primary server block that handles all application traffic.
# It terminates TLS and proxies requests to the bankiru-ui container
# running on 127.0.0.1:17060.
server {
    listen 443 ssl;
    http2 on;
    server_name bankiru.uva-advanced.ru;

    # TLS certificates (same as the www redirect block above).
    ssl_certificate     /etc/letsencrypt/live/bankiru.uva-advanced.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bankiru.uva-advanced.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ────────────────────────────────────────────────────
    # These headers are added to EVERY response from this server block.
    # CSP is intentionally NOT set — Gradio uses inline scripts and eval,
    # which a meaningfully-strict CSP would break.
    #
    # HSTS: tell browsers to always use HTTPS for this domain (1 year).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Prevent browsers from MIME-sniffing the Content-Type.
    add_header X-Content-Type-Options    "nosniff"                              always;
    # Allow framing only from the same origin (Gradio uses iframes internally,
    # so DENY would break the UI — SAMEORIGIN is the right choice here).
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    # Send the full URL as referrer only to same-origin; origin-only to cross-origin.
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
    # Disable access to sensitive browser APIs that this app doesn't need.
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ── Block sensitive dotfiles ────────────────────────────────────────────
    # Automated scanners routinely probe for .env, .git/, .svn/, etc.
    # Return 403 at the edge so the request never reaches the upstream app.
    # The regex `~ /\.` matches any URL path containing a dot-prefixed segment.
    location ~ /\. {
        # Nested exception: allow ACME challenge path (certbot uses /.well-known/).
        # Nginx processes the most specific matching location, so this nested
        # block takes priority over the outer deny-all for /.well-known/ paths.
        location ~ ^/\.well-known/ {
            proxy_pass         http://127.0.0.1:17060;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        # For all other dotfile paths: deny access and suppress log noise
        # from automated scanners.
        deny  all;
        access_log off;
        log_not_found off;
    }

    # ── Reject non-GET/HEAD on the root path ─────────────────────────────
    # Automated scanners routinely POST to / with spoofed browser UAs.
    # Block them at the edge so the request never reaches the upstream app
    # and doesn't pollute Logfire traces.  Only exact "/" is affected;
    # other paths (e.g. /login, /auth, /logout) pass through normally.
    # The `= /` modifier means this only matches the exact root path.
    location = / {
        # limit_except whitelists GET and HEAD; all other methods are denied.
        limit_except GET HEAD {
            deny all;
        }
        # Proxy allowed methods to the UI container.
        proxy_pass         http://127.0.0.1:17060;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
    }

    # ── Default location: proxy all other paths to the UI ───────────────
    # Handles /login, /auth, /logout, /favicon.ico, and any other paths
    # that don't match the more specific location blocks above.
    # The proxy_set_header directives pass the original client information
    # through to the upstream app so it can reconstruct the original URL
    # (needed for OIDC redirect_uri construction and session cookies).
    location / {
        proxy_pass         http://127.0.0.1:17060;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
    }

    # ── Gradio-specific location: WebSocket + SSE support ───────────────
    # Gradio's interactive UI requires WebSocket connections (for real-time
    # component updates) and Server-Sent Events (for streaming responses).
    # This location block adds the necessary headers and settings.
    location /gradio/ {
        proxy_pass             http://127.0.0.1:17060/gradio/;
        # HTTP/1.1 is required for WebSocket upgrade (HTTP/2 handles it
        # differently and Nginx's proxy module doesn't support h2 upstream).
        proxy_http_version     1.1;
        # These two headers enable the HTTP → WebSocket upgrade handshake.
        proxy_set_header       Upgrade            $http_upgrade;
        proxy_set_header       Connection         "upgrade";
        proxy_set_header       Host               $host;
        proxy_set_header       X-Forwarded-Proto  https;
        proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Host   $host;

        # Disable response buffering so SSE events are delivered immediately
        # to the browser instead of being batched by Nginx.
        # Gradio uses Server-Sent Events for streaming UI updates.
        proxy_buffering        off;
        # Long-running LLM summarizations may take up to 10 minutes.
        # Without this, Nginx would close the connection after the default
        # 60s read timeout.
        proxy_read_timeout     600s;
    }
}
