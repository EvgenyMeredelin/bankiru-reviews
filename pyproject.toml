[project]
name = "bankiru-reviews"
version = "0.1.0"
description = "Banki.ru negative reviews stack: parser + DB API in one Dockerized monorepo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiobotocore>=2.24.0",
    "apscheduler>=3.10.4",
    "authlib>=1.6.9",
    "beautifulsoup4>=4.13.4",
    "emoji>=2.14.1",
    "fastapi[standard]>=0.116.1",
    "gradio>=6.8.0",
    "httpx>=0.27.2",
    "itsdangerous>=2.2.0",
    "logfire[fastapi]>=4.3.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.1",
    "psycopg[binary,pool]>=3.2.9",
    "pyarrow>=21.0.0",
    "pydantic>=2.9.0",
    "pydantic-ai>=1.14.1",
    "pydantic-settings>=2.5.0",
    "python-dateutil>=2.9.0.post0",
    "sqlalchemy>=2.0.43",
    "styleframe>=4.2",
    "tiktoken>=0.8.0",
    "tzdata>=2024.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bankiru"]
